<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chasse au trésor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            /* TON FOND PERSONNALISÉ */
            background-image: url("Fondnoel.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            border-radius: 25px;

            padding: 40px 25px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        #result {
            margin-top: 25px;
        }

        .success {
            font-size: 24px;
            font-weight: bold;
        }

        .gift {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .error {
            font-size: 20px;
            font-weight: bold;
        }

        .loading {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎄 QRistmas des Vétos 🐾</h1>
        <p class="slogan">
    La course aux cadeaux est lancée !
</p>

        <div id="result" class="loading">
            Vérification en cours...
        </div>

    </div>

    <script src="config.js"></script>

    <script>
        async function verifierCode() {

            const params = new URLSearchParams(window.location.search);
            const code = params.get("code");

            const result = document.getElementById("result");

            if (!code) {
                result.innerHTML = `
                    <div class="error">
                        ⚠️ Aucun code trouvé.
                    </div>
                `;
                return;
            }

            try {

                const response = await fetch(
                    SUPABASE_URL + "/rest/v1/rpc/tenter_cadeau",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        },

                        body: JSON.stringify({
                            code_recu: code
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Erreur Supabase");
                }

                const data = await response.json();

                if (data && data.length > 0 && data[0].gagne === true) {

                    result.innerHTML = `
                        <div class="success">
                            🎉 BRAVO ! 🎉
                        </div>

                        <p>
                            Tu as gagné :
                        </p>

                        <div class="gift">
                            🎁 ${data[0].cadeau_gagne}
                        </div>
                      <p class="recuperation">
    Passe vite nous voir au secrétariat pour récupérer ton lot !
</p>
.recuperation {
    font-size: 14px;
    margin-top: 15px;
}
                    `;

                } else {

                    result.innerHTML = `
                        <div class="error">
                            😢 TROP TARD !
                        </div>

                        <p>
                            Ce cadeau a déjà été trouvé.
                        </p>

                        <p>
                            Cherche encore ! D'autres QR ne sont sans doute pas très loin...
                        </p>
                    `;
                }

            } catch (error) {

                console.error(error);

                result.innerHTML = `
                    <div class="error">
                        ⚠️ Oups...
                    </div>

                    <p>
                        Une erreur est survenue.
                        Réessaie dans quelques instants.
                    </p>
                `;
            }
        }

        verifierCode();
    </script>

</body>
</html>
```
